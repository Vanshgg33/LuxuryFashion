steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/luxury-fashion-backend:$BUILD_ID', '.']
    dir: 'LuxuryFashion-Backend'
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/luxury-fashion-backend:$BUILD_ID']

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
    - 'run'
    - 'deploy'
    - 'luxury-fashion-backend'
    - '--image'
    - 'gcr.io/$PROJECT_ID/luxury-fashion-backend:$BUILD_ID'
    - '--region'
    - 'asia-south1'
    - '--platform'
    - 'managed'
    - '--allow-unauthenticated'
    - '--port'
    - '8081'
    - '--memory'
    - '1Gi'
    - '--cpu'
    - '1'

images:
  - 'gcr.io/$PROJECT_ID/luxury-fashion-backend:$BUILD_ID'