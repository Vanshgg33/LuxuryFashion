<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Rangeela Dhaba</title>
    <script>
      // Redirect to the app - let React Router handle the route
      const path = window.location.pathname + window.location.search + window.location.hash;
      window.location.replace('/' + (path !== '/' ? '?redirect=' + encodeURIComponent(path) : ''));
    </script>
  </head>
  <body>
    <noscript>
      <meta http-equiv="refresh" content="0; url=/">
    </noscript>
  </body>
</html>
