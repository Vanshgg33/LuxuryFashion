<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Golden gradient matching the website theme -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7B733;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F5A623;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E09422;stop-opacity:1" />
    </linearGradient>
    <!-- Dark warm background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D2420;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1512;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Warm dark background with rounded corners -->
  <rect width="32" height="32" rx="6" fill="url(#bgGradient)"/>

  <!-- Stylized bowl/plate shape representing food -->
  <ellipse cx="16" cy="20" rx="10" ry="4" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.6"/>

  <!-- Steam/aroma lines - representing hot food -->
  <path d="M11 10 Q12 8 11 6" stroke="url(#goldGradient)" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M16 9 Q17 7 16 5" stroke="url(#goldGradient)" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M21 10 Q22 8 21 6" stroke="url(#goldGradient)" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- Stylized "RD" monogram -->
  <g transform="translate(16, 16)">
    <!-- Letter "R" - elegant style -->
    <path d="M-7 -4 L-7 6 M-7 -4 C-7 -4 -3 -5 -3 -1 C-3 2 -7 1 -7 1 M-7 1 L-3 6"
          stroke="url(#goldGradient)"
          stroke-width="2"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Letter "D" - refined style -->
    <path d="M2 -4 L2 6 M2 -4 C2 -4 8 -4 8 1 C8 6 2 6 2 6"
          stroke="url(#goldGradient)"
          stroke-width="2"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- Decorative corner accents -->
  <circle cx="4" cy="4" r="1" fill="url(#goldGradient)" opacity="0.4"/>
  <circle cx="28" cy="4" r="1" fill="url(#goldGradient)" opacity="0.4"/>
  <circle cx="4" cy="28" r="1" fill="url(#goldGradient)" opacity="0.4"/>
  <circle cx="28" cy="28" r="1" fill="url(#goldGradient)" opacity="0.4"/>
</svg>
